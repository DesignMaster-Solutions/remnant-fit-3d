<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remnant Fit 3D: cut a kitchen out of stone scrap</title>
<meta name="description" content="A browser puzzle built with Aholo Lux3D: fit real-looking stone offcuts onto a kitchen counter with the least waste and the fewest seams.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --crayon: #f4c430; --slate: #1d2023; --paper: #eceae4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--slate); color: var(--paper); font: 500 16px/1.3 Barlow, system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  header { position: fixed; top: 0; left: 0; right: 0; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 4px 28px; align-items: baseline; pointer-events: none; }
  h1 { font-size: 18px; font-weight: 700; margin: 0; color: var(--crayon); }
  #stats { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
  #stats b { font-size: 20px; font-weight: 700; display: block; line-height: 1.1; }
  #stats span { font-size: 12px; opacity: .75; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: nowrap; }
  button { font: 700 15px Barlow, system-ui, sans-serif; color: var(--slate); background: var(--crayon); border: 0; border-radius: 4px; padding: 11px 16px; white-space: nowrap; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #reset { background: none; color: var(--paper); text-decoration: underline; padding: 11px 4px; }
  #hint { font-size: 14px; opacity: .85; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; background: var(--slate); transition: opacity .3s; }
  #load.gone { opacity: 0; pointer-events: none; }
  @media (max-width: 480px) { #stats { gap: 12px; } #stats b { font-size: 17px; } #hint { display: none; } }
</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
} }</script>
</head>
<body>
<header>
  <h1>Remnant Fit 3D</h1>
  <div id="stats" aria-live="polite">
    <div><b id="s-cov">0%</b><span>counter covered</span></div>
    <div><b id="s-waste">0.00 m²</b><span>sawn off</span></div>
    <div><b id="s-seam">0.0 m</b><span>seams</span></div>
    <div><b id="s-kg">0 kg</b><span>saved from the skip</span></div>
  </div>
</header>
<footer>
  <button id="turn" disabled>Turn slab</button>
  <button id="reset">Start over</button>
  <div id="hint">Drag a slab onto the yellow outline. Anything hanging off gets sawn away.</div>
</footer>
<div id="load">Bringing the slabs in from the yard…</div>
<script type="module" src="game.js"></script>
</body>
</html>
